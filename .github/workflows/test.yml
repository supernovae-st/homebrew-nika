name: tap gate

# The tap's own CI (SOTA tap convention · hashicorp/goreleaser pattern):
# every formula change is styled, audited, INSTALLED for real, and the
# installed binary smoke-tested — the structural catch for the classes
# that shipped silently before (missing completions · a test asserting
# output the binary no longer prints · a sha/url mismatch).
#
# Security: push/PR triggers only · no user-controlled strings reach the
# shell · the workflow reads repo files and GitHub release artifacts only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: style · audit · install · smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: brew style
        run: brew style ./Formula/nika.rb

      - name: Install from this checkout
        run: |
          set -euo pipefail
          # Tap from the checkout so the PR's formula (not main's) installs.
          brew tap supernovae-st/tap "file://$GITHUB_WORKSPACE"
          brew install supernovae-st/tap/nika

      - name: brew audit (formula in the installed tap)
        # --except version: the binary-formula false positive — our urls
        # interpolate `#{version}`, so brew re-scans the resolved url and
        # calls the stanza redundant; the stanza is deliberately the ONE
        # line scripts/release/update-formula.sh rewrites per release.
        run: brew audit --except version --formula supernovae-st/tap/nika

      - name: brew test (the formula's own test block)
        run: brew test supernovae-st/tap/nika

      - name: Smoke the installed binary
        run: |
          set -euo pipefail
          nika --version
          # Completions generate for every shell the formula installs.
          nika completions zsh  >/dev/null
          nika completions bash >/dev/null
          nika completions fish >/dev/null
          # The embedded surfaces answer offline.
          nika spec --canon | head -3
          # examples run stages to a temp file and never journals — no flag needed.
          nika examples run 01-hello --model mock/echo
